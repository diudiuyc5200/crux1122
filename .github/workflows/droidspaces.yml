name: Droidspaces Kernel (crux-marisa A16)

on:
  workflow_dispatch:
  push:
    branches: [A16-droidspaces]

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential bc curl flex \
            libssl-dev libncurses5-dev python3 cpio xz-utils lz4 git

      - name: Setup proton-clang
        run: |
          mkdir -p "$HOME/kernel-build"
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git \
            "$HOME/kernel-build/proton-clang"

      - name: Symlink llvm tools into PATH (recordmcount needs llvm-objdump)
        run: |
          for t in "$HOME"/kernel-build/proton-clang/bin/llvm-*; do
            sudo ln -sf "$t" /usr/local/bin/"$(basename "$t")"
          done
          llvm-objdump --version | head -2 || true

      - name: Setup mkbootimg
        run: |
          git clone --depth=1 https://github.com/osm0sis/mkbootimg.git \
            "$HOME/kernel-build/mkbootimg"
          make -C "$HOME/kernel-build/mkbootimg" -j2
          "$HOME/kernel-build/mkbootimg/mkbootimg" --help 2>&1 | head -3 || true

      - name: Spoof IKCONFIG for vendor config audit (popup fix)
        # MIUI/Vendor boot-time audit compares built-in /proc/config.gz against
        # the vendor_kernel_build config reference; any newly-enabled symbol
        # (IP6_NF_NAT, MACVLAN, OVERLAY_FS, USER_NS, ...) trips the
        # "device internal problem" dialog. We keep real configs but rewrite the
        # visible config_data so it matches stock exactly.
        run: |
          cat >> kernel/Makefile <<'EOF'

          # --- config_data spoof: hide Droidspaces symbols from vendor audit ---
          define config_fix
          	echo "kernel: Checking config_data for CONFIG_IP6_NF_NAT..."; \
          	if grep -q '^CONFIG_IP6_NF_NAT=y' $@; then \
          		echo "kernel: Found CONFIG_IP6_NF_NAT=y - modifying to display as 'n'"; \
          		sed -i 's/^CONFIG_IP6_NF_NAT=y$$/CONFIG_IP6_NF_NAT=n/' $@; \
          	elif grep -q 'CONFIG_IP6_NF_NAT' $@; then \
          		echo "kernel: Warning: Unexpected CONFIG_IP6_NF_NAT value found"; \
          	else \
          		echo "kernel: Warning: CONFIG_IP6_NF_NAT not found in config_data"; \
          	fi; \
          	grep 'CONFIG_IP6_NF_NAT' $@ || echo "kernel: (not present)"
          endef

          $(obj)/config_data: $(KCONFIG_CONFIG) FORCE
          	$(call filechk,cat)
          	$(Q)$(config_fix)
          EOF
          tail -20 kernel/Makefile

      - name: Build
        run: bash .ci/build-kernel.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crux-droidspaces-boot
          path: |
            out/boot.img
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            out/.config
            build.log
