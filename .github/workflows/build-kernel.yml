name: build-raphael-4.14

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev device-tree-compiler \
            gcc-aarch64-linux-gnu make

      - name: Show toolchain versions
        run: aarch64-linux-gnu-gcc --version | head -1

      - name: Configure (raphael_defconfig)
        run: |
          set -o pipefail
          mkdir -p out
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            DTC_EXT=dtc \
            raphael_defconfig 2>&1 | tee out.configure.log \
            || { echo "CONFIGURE FAILED"; exit 1; }

      - name: Build Image and dtbs
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            DTC_EXT=dtc \
            Image dtbs 2>&1 | tee out.build.log \
            || { echo "BUILD FAILED"; exit 1; }

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/qcom/*.dtb artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/qcom/*.dtbo artifacts/ 2>/dev/null || true
          cp out/.config artifacts/config-raphael 2>/dev/null || true
          cp out.build.log out.configure.log artifacts/ 2>/dev/null || true
          ls -lh artifacts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raphael-4.14-image
          path: artifacts/
          if-no-files-found: warn
