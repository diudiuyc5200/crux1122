          if-no-files-found: warn

      # Publish the failing log to a branch so it can be inspected without
      # authenticated artifact access.
      - name: Publish failure log to branch
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "run: $GITHUB_RUN_ID  commit: $GITHUB_SHA"
            echo "=== configure (tail) ==="
            tail -40 out.configure.log 2>/dev/null
            echo "=== build: errors ==="
            grep -nE "error:|Error [0-9]|No rule to make|undefined reference|fatal error" out.build.log 2>/dev/null | tail -60
            echo "=== build (tail) ==="
            tail -120 out.build.log 2>/dev/null
          } > ci-build-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-build-failure.log
          git commit -m "ci: build failure log (run $GITHUB_RUN_ID)" || true
          git push --force origin ci-logs

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download flashable zip
        uses: actions/download-artifact@v4
        with:
          name: Zundamon-4.14.357-${{ env.KVERNUM }}-${{ env.KSTAGE }}
          path: dist

      - name: Fetch KernelSU-Next managers
        run: |
          curl -fsSL -o "dist/KernelSU-Next-v3.4.2.apk" "$KSU_MANAGER_URL" || true
          curl -fsSL -o "dist/KernelSU-Next-v3.2.0.apk" "$KSU_MANAGER_FALLBACK_URL" || true
          ls -lh dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ env.KVERNUM }}-${{ env.KSTAGE }}-4.14
        run: |
          set -e
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --title "Zundamon 4.14.357 ${{ env.KVERNUM }}-${{ env.KSTAGE }} (raphael / K20 Pro)" \
            --prerelease \
            --notes "Zundamon kernel for Redmi K20 Pro (raphael), 4.14.357, ${{ env.KSTAGE }}.

          uname: 4.14.357-Zundamon-${{ env.KVERNUM }}-${{ env.KSTAGE }}

          - Zundamon-4.14.357-${{ env.KVERNUM }}-${{ env.KSTAGE }}.zip: AnyKernel3 flashable zip (Image only, keeps your ROM dtbo).
          - KernelSU-Next-v3.4.2.apk: manager matching the built-in KernelSU (KSU-Next). Try this first.
          - KernelSU-Next-v3.2.0.apk: fallback manager if 3.4.2 reports an unsupported kernel.
          - The flashable zip also copies the manager to /sdcard/Download/Zundamon/; install it after boot.

          Backup boot/dtbo before flashing." \
            dist/*.zip dist/*.sha256 dist/*.apk
