name: build-raphael-4.14

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  KNAME: Zundamon
  KVERNUM: "1.0"
  KSTAGE: "rc1"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
<<<<<<< HEAD
            bc bison flex libssl-dev libelf-dev device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi make
=======
            bc bison flex libssl-dev libelf-dev libyaml-dev device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi make zip unzip curl
>>>>>>> e186a347377e (raphael 4.14: seamless disable balance; release naming 1.0-rc1 + AnyKernel3 zip)

      - name: Show toolchain versions
        run: aarch64-linux-gnu-gcc --version | head -1

      - name: Configure (raphael_defconfig)
        run: |
          set -o pipefail
          mkdir -p out
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            DTC_EXT=dtc \
            raphael_defconfig 2>&1 | tee out.configure.log \
            || { echo "CONFIGURE FAILED"; exit 1; }

      - name: Build Image and dtbs
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            DTC_EXT=dtc \
            Image dtbs 2>&1 | tee out.build.log \
            || { echo "BUILD FAILED"; exit 1; }

      - name: Build dtbo.img
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            NO_YAML=1 \
            DTC_EXT=dtc \
            arch/arm64/boot/dts/qcom/dtbo.img || true
          ls -l out/arch/arm64/boot/dts/qcom/dtbo.img || echo "no dtbo.img"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/qcom/*.dtb artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/qcom/*.dtbo artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/qcom/dtbo.img artifacts/ 2>/dev/null || true
          cp out/.config artifacts/config-raphael 2>/dev/null || true
          cp out/include/config/kernel.release artifacts/ 2>/dev/null || true
          cp out.build.log out.configure.log artifacts/ 2>/dev/null || true
          ls -lh artifacts

      - name: Package AnyKernel3 flashable zip
        if: success()
        run: |
          KREL=$(cat out/include/config/kernel.release)
          KVER=${KREL%%-*}
          ZIPNAME="${KNAME}-${KVER}-${KVERNUM}${KSTAGE:+-$KSTAGE}.zip"
          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"

          curl -fsSL -o ak3.zip https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip
          unzip -q ak3.zip
          mv AnyKernel3-master ak3

          cat > ak3/anykernel.sh <<EOF
          properties() { '
          kernel.string=${KNAME}-${KVER}-${KVERNUM}${KSTAGE:+-$KSTAGE} for Redmi K20 Pro (raphael), uname: ${KREL}
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=raphael
          device.name2=cepheus
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          cp out/arch/arm64/boot/Image ak3/Image
          if [ -f out/arch/arm64/boot/dts/qcom/dtbo.img ]; then
            cp out/arch/arm64/boot/dts/qcom/dtbo.img ak3/dtbo.img
          fi
          (cd ak3 && zip -r9 "../${ZIPNAME}" . -x '*.git*')
          sha256sum "${ZIPNAME}" > "${ZIPNAME}.sha256"
          ls -lh "${ZIPNAME}" "${ZIPNAME}.sha256"

      - name: Upload flashable zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zundamon-4.14.357-${{ env.KVERNUM }}-${{ env.KSTAGE }}
          path: |
            Zundamon-*.zip
            Zundamon-*.zip.sha256
          if-no-files-found: error

      - name: Upload raw artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raphael-4.14-image
          path: artifacts/
          if-no-files-found: warn

      # Publish the failing log to a branch so it can be inspected without
      # authenticated artifact access.
      - name: Publish failure log to branch
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "run: $GITHUB_RUN_ID  commit: $GITHUB_SHA"
            echo "=== configure (tail) ==="
            tail -40 out.configure.log 2>/dev/null
            echo "=== build: errors ==="
            grep -nE "error:|Error [0-9]|No rule to make|undefined reference|fatal error" out.build.log 2>/dev/null | tail -60
            echo "=== build (tail) ==="
            tail -120 out.build.log 2>/dev/null
          } > ci-build-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-build-failure.log
          git commit -m "ci: build failure log (run $GITHUB_RUN_ID)" || true
          git push --force origin ci-logs
